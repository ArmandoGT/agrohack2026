# Loop de CI: a cada push, testes unitários + loop de avaliação + robustez + build.
name: CI
on: [push, pull_request]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run eval
      - run: npm run eval:robustez
      - run: npm run build
